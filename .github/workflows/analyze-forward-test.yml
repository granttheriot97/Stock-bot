name: Analyze B27B forward test
on:
  schedule:
    - cron: "25 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze persistent archive
        run: python analysis_forward_test.py
      - name: Commit analysis
        run: |
          git add paper_history/analysis
          git diff --cached --quiet && exit 0
          git config user.name "b27b-paper-analyst"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Update B27B forward-test analysis"
          git pull --rebase origin main
          git push
