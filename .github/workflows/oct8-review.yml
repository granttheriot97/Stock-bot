name: Build B27B October 8 review
on:
  schedule:
    - cron: "20 6 8 10 *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build persistent review
        run: python build_oct8_review.py
      - name: Commit review
        run: |
          git config user.name "b27b-paper-review"
          git config user.email "actions@users.noreply.github.com"
          git add paper_history/reviews
          git diff --cached --quiet && exit 0
          git commit -m "Build October 8 B27B forward-test review"
          git pull --rebase origin main
          git push
