name: B27B free-data probe

on:
  push:
    branches:
      - b27b-free-data-probe
    paths:
      - .github/workflows/b27b-free-data-probe.yml

permissions:
  contents: read

jobs:
  probe-stooq-bulk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download official Stooq U.S. daily archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors             --connect-timeout 30 --max-time 1200             https://static.stooq.com/db/h/d_us_txt.zip             --output d_us_txt.zip
          test -s d_us_txt.zip
          unzip -tq d_us_txt.zip
          sha256sum d_us_txt.zip > archive.sha256

      - name: Validate archive and independent control symbols
        shell: python
        run: |
          import csv
          import hashlib
          import io
          import json
          import math
          import statistics
          import urllib.request
          import zipfile
          from datetime import datetime, timezone

          ARCHIVE = "d_us_txt.zip"
          CANDIDATES = [
              "AABA","ABC","ABMD","ADS","AET","AGN","ALXN","ANDV","ANSS","ANTM",
              "ARNC","ATVI","BCR","BHGE","BK","BLL","CA","CBS","CDAY","CELG"
          ]
          CONTROLS = ["SPY","AAPL","MSFT"]

          def parse_member(zf, member):
              raw = zf.read(member).decode("utf-8", errors="replace")
              rows = list(csv.reader(io.StringIO(raw)))
              if not rows:
                  return {}, {}
              header = [c.strip().strip("<>").upper() for c in rows[0]]
              data = rows[1:] if "DATE" in header else rows
              idx = {name: i for i, name in enumerate(header)}
              if not {"DATE","OPEN","HIGH","LOW","CLOSE"}.issubset(idx):
                  return {"error": "required columns absent", "header": header}, {}
              parsed = {}
              violations = 0
              for row in data:
                  try:
                      date = row[idx["DATE"]].strip()
                      o = float(row[idx["OPEN"]])
                      h = float(row[idx["HIGH"]])
                      l = float(row[idx["LOW"]])
                      c = float(row[idx["CLOSE"]])
                      if not (l <= min(o, c) <= max(o, c) <= h):
                          violations += 1
                      parsed[date] = c
                  except (ValueError, IndexError):
                      continue
              dates = sorted(parsed)
              summary = {
                  "rows": len(parsed),
                  "date_min": dates[0] if dates else None,
                  "date_max": dates[-1] if dates else None,
                  "ohlc_invariant_violations": violations,
              }
              return summary, parsed

          def yahoo_closes(symbol):
              start = int(datetime(2016, 1, 1, tzinfo=timezone.utc).timestamp())
              end = int(datetime.now(timezone.utc).timestamp())
              url = (
                  "https://query1.finance.yahoo.com/v8/finance/chart/"
                  f"{symbol}?period1={start}&period2={end}&interval=1d&events=history"
              )
              req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=45) as response:
                  payload = json.load(response)
              result = payload["chart"]["result"][0]
              timestamps = result["timestamp"]
              closes = result["indicators"]["quote"][0]["close"]
              return {
                  datetime.fromtimestamp(ts, timezone.utc).strftime("%Y%m%d"): float(close)
                  for ts, close in zip(timestamps, closes)
                  if close is not None
              }

          def corr(xs, ys):
              if len(xs) < 2:
                  return None
              mx, my = statistics.fmean(xs), statistics.fmean(ys)
              num = sum((x-mx)*(y-my) for x,y in zip(xs,ys))
              den = math.sqrt(sum((x-mx)**2 for x in xs) * sum((y-my)**2 for y in ys))
              return num / den if den else None

          def returns(series, dates):
              out = []
              for a, b in zip(dates, dates[1:]):
                  if series[a] and series[b]:
                      out.append(series[b] / series[a] - 1.0)
              return out

          report = {
              "source_url": "https://static.stooq.com/db/h/d_us_txt.zip",
              "archive_sha256": hashlib.sha256(open(ARCHIVE, "rb").read()).hexdigest(),
              "candidate_symbols": {},
              "controls": {},
          }

          with zipfile.ZipFile(ARCHIVE) as zf:
              members = [n for n in zf.namelist() if n.lower().endswith(".txt")]
              by_symbol = {}
              for member in members:
                  base = member.rsplit("/", 1)[-1].lower()
                  if base.endswith(".us.txt"):
                      by_symbol[base[:-7].upper()] = member
              report["archive_txt_members"] = len(members)
              report["us_symbol_members"] = len(by_symbol)

              parsed_cache = {}
              for symbol in CANDIDATES + CONTROLS:
                  member = by_symbol.get(symbol)
                  if not member:
                      summary, parsed = {"present": False}, {}
                  else:
                      summary, parsed = parse_member(zf, member)
                      summary["present"] = True
                      summary["member"] = member
                  parsed_cache[symbol] = parsed
                  target = "candidate_symbols" if symbol in CANDIDATES else "controls"
                  report[target][symbol] = summary

              for symbol in CONTROLS:
                  try:
                      yahoo = yahoo_closes(symbol)
                      stooq = parsed_cache[symbol]
                      common = sorted(set(yahoo) & set(stooq))[-750:]
                      stooq_ret = returns(stooq, common)
                      yahoo_ret = returns(yahoo, common)
                      report["controls"][symbol]["independent_check"] = {
                          "provider": "Yahoo chart",
                          "common_dates": len(common),
                          "daily_return_correlation": corr(stooq_ret, yahoo_ret),
                      }
                  except Exception as exc:
                      report["controls"][symbol]["independent_check"] = {
                          "error": f"{type(exc).__name__}: {exc}"
                      }

          present = sum(1 for v in report["candidate_symbols"].values() if v.get("present"))
          valid = sum(
              1 for v in report["candidate_symbols"].values()
              if v.get("present") and v.get("rows", 0) > 0 and v.get("ohlc_invariant_violations") == 0
          )
          correlations = [
              v.get("independent_check", {}).get("daily_return_correlation")
              for v in report["controls"].values()
          ]
          correlations = [x for x in correlations if isinstance(x, (int, float))]
          report["summary"] = {
              "candidate_present": present,
              "candidate_valid": valid,
              "candidate_requested": len(CANDIDATES),
              "control_correlations": correlations,
              "probe_pass": (
                  valid >= 15
                  and len(correlations) >= 2
                  and min(correlations) >= 0.995
              ),
          }

          with open("stooq_probe_report.json", "w", encoding="utf-8") as handle:
              json.dump(report, handle, indent=2, sort_keys=True)
          print(json.dumps(report["summary"], sort_keys=True))

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: b27b-stooq-bulk-probe
          path: |
            stooq_probe_report.json
            archive.sha256
          retention-days: 7
