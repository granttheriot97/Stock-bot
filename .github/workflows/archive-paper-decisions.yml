name: Archive B27B paper decisions
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and append unseen decisions
        run: |
          python - <<'PY'
          import json, urllib.request, pathlib, datetime
          url="https://b27b-live-paper-probe.onrender.com"
          try:
              with urllib.request.urlopen(url, timeout=90) as r:
                  s=json.load(r)
          except Exception as e:
              print("fetch failed:", e); raise SystemExit(0)
          events=(s.get("paper") or {}).get("decision_log") or []
          p=pathlib.Path("paper_history/decisions.jsonl")
          old=p.read_text().splitlines() if p.exists() else []
          seen=set()
          for line in old:
              try:
                  x=json.loads(line); seen.add((x.get("ts"),x.get("slug"),x.get("pair_cost"),x.get("result")))
              except: pass
          new=[]
          for x in events:
              k=(x.get("ts"),x.get("slug"),x.get("pair_cost"),x.get("result"))
              if k not in seen:
                  new.append(json.dumps(x,separators=(",",":")))
                  seen.add(k)
          if new:
              p.parent.mkdir(exist_ok=True)
              with p.open("a") as f:
                  for line in new:f.write(line+"\n")
              print("appended",len(new),"decisions")
          else: print("no new decisions")
          PY
      - name: Commit archive
        run: |
          if git diff --quiet -- paper_history/decisions.jsonl; then exit 0; fi
          git config user.name "b27b-paper-archiver"
          git config user.email "actions@users.noreply.github.com"
          git add paper_history/decisions.jsonl
          git commit -m "Archive B27B paper decisions"
          git push
